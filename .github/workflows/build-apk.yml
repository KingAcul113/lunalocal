name: Build Luna APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Luna
        uses: actions/checkout@v4
        with:
          path: luna

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama
          fetch-depth: 1

      - name: Overlay Luna app
        run: |
          rm -rf llama/examples/llama.android/app/src/main
          cp -r luna/app/src/main llama/examples/llama.android/app/src/main
          cp luna/app/build.gradle.kts llama/examples/llama.android/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.