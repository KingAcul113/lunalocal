name: Build Luna APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Luna
        uses: actions/checkout@v4
        with:
          path: luna

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Overlay Luna app
        run: |
          rm -rf llama/examples/llama.android/app/src/main
          cp -r luna/app/src/main llama/examples/llama.android/app/src/main
          cp luna/app/build.gradle.kts llama/examples/llama.android/app/build.gradle.kts

      - name: Build Luna APK
        working-directory: llama/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Luna APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Local-debug-apk
          path: llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error