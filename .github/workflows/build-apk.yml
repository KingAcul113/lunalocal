name: Build Luna APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: luna

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama
          fetch-depth: 1

      - name: Overlay Luna app
        run: |
          rm -rf llama/examples/llama.android/app/src/main
          cp -r luna/app/src/main llama/examples/llama.android/app/src/main
          cp luna/app/build.gradle.kts llama/examples/llama.android/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build
        working-directory: llama/examples/llama.android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Local-debug-apk
          path: llama/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk